services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: thirdspace
      DB_USER: thirdspace
      DB_PASSWORD: thirdspace_dev
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: thirdspace
      MYSQL_USER: thirdspace
      MYSQL_PASSWORD: thirdspace_dev
      MYSQL_ROOT_PASSWORD: local_root_dev
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  db_data:
